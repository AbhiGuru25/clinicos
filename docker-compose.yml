services:

  # ─── Evolution API (WhatsApp Bot) ─────────────────────────────────────────
  evolution-api:
    image: atendai/evolution-api:v1.8.2
    restart: always
    ports:
      - "8081:8080"
    environment:
      - SERVER_URL=http://localhost:8081
      - AUTHENTICATION_API_KEY=YourSecretKey123
    volumes:
      - evolution_instances:/evolution/instances

  # ─── n8n (Workflow Automation) ────────────────────────────────────────────
  n8n:
    image: n8nio/n8n:latest
    restart: always
    ports:
      - "5678:5678"
    environment:
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - NODE_ENV=production
    volumes:
      - D:/N8N:/home/node/.n8n

volumes:
  evolution_instances:
